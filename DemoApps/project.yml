name: Showcase
options:
  bundleIdPrefix: com.sumara.designsystem.showcase
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  DesignKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
targets:
  ShowcasePhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: DesignKit
        products: [DesignKit, DesignSystem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sumara.designsystem.showcase.phone
        PRODUCT_NAME: ShowcasePhone
        INFOPLIST_KEY_CFBundleDisplayName: Showcase
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ShowcasePad:
    type: application
    platform: iOS
    sources:
      - Shared
      - Pad
    dependencies:
      - package: DesignKit
        products: [DesignKit, DesignSystem]
    info:
      path: Generated/ShowcasePad-Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sumara.designsystem.showcase.pad
        PRODUCT_NAME: ShowcasePad
        INFOPLIST_KEY_CFBundleDisplayName: Showcase
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ShowcaseMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: DesignKit
        products: [DesignKit, DesignSystem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sumara.designsystem.showcase.mac
        PRODUCT_NAME: ShowcaseMac
        INFOPLIST_KEY_CFBundleDisplayName: Showcase
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  ShowcasePhone:
    build:
      targets:
        ShowcasePhone: all
    run:
      config: Debug
    archive:
      config: Release
  ShowcasePad:
    build:
      targets:
        ShowcasePad: all
    run:
      config: Debug
    archive:
      config: Release
  ShowcaseMac:
    build:
      targets:
        ShowcaseMac: all
    run:
      config: Debug
    archive:
      config: Release
